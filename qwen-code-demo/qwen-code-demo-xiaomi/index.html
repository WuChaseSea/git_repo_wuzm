<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贴心小秘书</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>贴心小秘书</h1>
            <p>您的心情，我来呵护</p>
        </header>
        
        <main>
            <section class="location-section">
                <h2>当前位置</h2>
                <div id="location-info">
                    <p>正在获取您的位置...</p>
                </div>
            </section>
            
            <section class="mood-section">
                <h2>心情分享</h2>
                <textarea id="mood-input" placeholder="今天心情怎么样？(例如：很累、心情不好、想放松...)"></textarea>
                <button id="mood-submit">提交心情</button>
                <div id="comfort-message" class="comfort-card"></div>
            </section>
            
            <section class="recommendations-section">
                <h2>贴心推荐</h2>
                <div id="recommendations-container"></div>
            </section>
            
            <section class="route-section">
                <h2>情绪路线</h2>
                <div id="route-container"></div>
            </section>
            
            <section class="surprise-section">
                <h2>小确幸惊喜</h2>
                <button id="surprise-button">制造小惊喜</button>
                <div id="surprise-plan"></div>
            </section>
            
            <section class="diary-section" id="diary-section" style="display: none;">
                <h2>情绪日记</h2>
                <div id="diary-entries"></div>
            </section>
        </main>
    </div>
    
    <!-- 高德地图容器 -->
    <div id="map-container" style="width: 100%; height: 300px; display: none;"></div>
    
    <button id="diary-button" class="floating-button">查看情绪日记</button>
    
    <script src="https://webapi.amap.com/maps?v=1.4.15&key=YOUR_API_KEY"></script>
    <script src="script.js"></script>
</body>
</html>
